<style>
:root{--yellow:#F5C518;--yellow-light:#FFF8E1;--yellow-dark:#D4A017;--navy:#1a1f3c;--navy-light:#2d3561;--navy-soft:rgba(26,31,60,0.06);--red:#e74c3c;--green:#27ae60;--green-dark:#1e8449;--white:#ffffff;--cream:#FFFBF0;--gray-50:#f8f9fa;--gray-100:#f1f3f4;--gray-200:#e8eaed;--gray-300:#dadce0;--gray-600:#5f6368;--gray-700:#444746;--gray-800:#3c4043;--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow:0 4px 12px rgba(0,0,0,0.06);--shadow-md:0 8px 20px rgba(0,0,0,0.08);--shadow-lg:0 12px 32px rgba(0,0,0,0.12);--radius:14px;--radius-lg:18px;--radius-full:999px;--max-width:1200px;--header-height:64px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray-200);height:var(--header-height)}
.nav-inner{max-width:var(--max-width);margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:100%}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:38px;height:38px;border-radius:10px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:'Luckiest Guy',cursive;font-size:18px;color:var(--navy);box-shadow:0 2px 0 var(--yellow-dark);overflow:hidden}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.logo-text{font-family:'Luckiest Guy',cursive;font-size:22px;color:var(--navy);letter-spacing:0.5px;line-height:1}
.logo-text span{color:var(--yellow-dark);-webkit-text-stroke:1.5px var(--navy)}
.nav-links{display:none;gap:28px;align-items:center}
.nav-links a{text-decoration:none;color:var(--gray-700);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;transition:color .2s}
.nav-links a:hover{color:var(--navy)}
.nav-cta{display:none;align-items:center;gap:6px;background:var(--navy);color:var(--white);text-decoration:none;padding:8px 16px;border-radius:var(--radius-full);font-size:12px;font-weight:800;transition:transform .15s,box-shadow .15s}
.nav-cta:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
@media(min-width:768px){.nav-links{display:flex}.nav-cta{display:inline-flex}}
.hero{background:linear-gradient(180deg,var(--yellow-light) 0%,var(--white) 100%);padding:40px 20px 50px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-80px;right:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(245,197,24,0.25) 0%,transparent 70%);pointer-events:none}
.hero-inner{max-width:var(--max-width);margin:0 auto;display:grid;grid-template-columns:1fr;gap:32px;align-items:center}
@media(min-width:900px){.hero-inner{grid-template-columns:1.1fr 0.9fr}}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--gray-200);padding:5px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:0.06em;box-shadow:var(--shadow-sm);margin-bottom:16px}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.hero h1{font-family:'Luckiest Guy','Arial Black',sans-serif;font-weight:400;font-size:clamp(32px,5.5vw,52px);line-height:1.1;color:var(--navy);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px}
.hero h1 .accent{color:var(--yellow-dark);-webkit-text-stroke:2px var(--navy);text-shadow:2px 2px 0 rgba(0,0,0,0.08)}
.hero-sub{font-size:16px;color:var(--gray-700);max-width:460px;margin-bottom:22px;line-height:1.6}
.trust-badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.t-badge{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--gray-200);padding:6px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:700;color:var(--gray-700);box-shadow:var(--shadow-sm)}
.t-badge svg{width:16px;height:16px;flex-shrink:0}
.social-proof{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatars{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;border:2px solid var(--white);margin-left:-8px;background:var(--gray-200);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--gray-600)}
.avatars .av:first-child{margin-left:0}
.social-proof-text{font-size:13px;font-weight:700;color:var(--gray-700)}
.social-proof-text strong{color:var(--navy)}

/* BLOQUE DE INSTRUCCIONES: CÓMO USAR EL CUPÓN */
.how-to-use-banner{
  background: var(--navy);
  color: var(--white);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow-md);
  border: 2px solid var(--yellow);
}
.how-to-use-icon{
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--yellow);
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 3px 0 var(--yellow-dark);
}
.how-to-use-content h3{
  font-family: 'Luckiest Guy', sans-serif;
  font-size: 17px;
  color: var(--yellow);
  margin-bottom: 2px;
  letter-spacing: 0.5px;
}
.how-to-use-content p{
  font-size: 13.5px;
  line-height: 1.45;
  color: rgba(255,255,255,0.95);
  font-weight: 500;
}

.search-section{max-width:var(--max-width);margin:-24px auto 28px;padding:0 16px;position:relative;z-index:10}
.search-box{background:var(--white);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-lg);border:1px solid var(--gray-200)}
.search-row{display:flex;gap:10px;margin-bottom:14px}
.search-input{flex:1;padding:14px 18px;border-radius:var(--radius-full);border:2px solid var(--gray-200);background:var(--gray-50);color:var(--gray-800);font-size:15px;font-weight:600;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(245,197,24,0.15);outline:none}
.search-input::placeholder{color:var(--gray-600);font-weight:500}
.search-btn{background:var(--yellow);color:var(--navy);border:none;padding:0 24px;border-radius:var(--radius-full);font-weight:900;font-size:14px;cursor:pointer;transition:all .15s;font-family:inherit;box-shadow:0 3px 0 var(--yellow-dark);white-space:nowrap}
.search-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--yellow-dark)}
.search-btn:active{transform:translateY(0);box-shadow:0 1px 0 var(--yellow-dark)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--gray-300);background:transparent;color:var(--gray-700);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;padding:8px 16px;border-radius:var(--radius-full);cursor:pointer;font-family:inherit;transition:all .15s ease;white-space:nowrap}
.chip:hover{background:var(--gray-100);border-color:var(--gray-600)}
.chip.active{background:var(--navy);color:var(--white);border-color:var(--navy);box-shadow:var(--shadow-sm)}
.main-layout{max-width:var(--max-width);margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:1024px){.main-layout{grid-template-columns:1fr 300px}}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-title{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:24px;color:var(--navy);display:flex;align-items:center;gap:8px}
.section-title .emoji{font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}

/* CUPÓN: ESTILOS Y COLORES PERSONALIZADOS DESDE GOOGLE SHEETS */
.coupon{position:relative;background:var(--white);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;border:1px solid var(--gray-200);font-family:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s;border-top:4px solid var(--yellow);box-shadow:var(--shadow-sm);overflow:hidden}
.coupon:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.coupon:active{transform:translateY(-1px)}

/* Clases de colores de fondo predefinidas */
.coupon.clr-amarillo{ background-color: #FFF8E1 !important; border-top-color: #F5C518 !important; }
.coupon.clr-rojo{ background-color: #FFEBEE !important; border-top-color: #E74C3C !important; }
.coupon.clr-azul{ background-color: #E3F2FD !important; border-top-color: #2980B9 !important; }
.coupon.clr-verde{ background-color: #E8F5E9 !important; border-top-color: #27AE60 !important; }
.coupon.clr-gris{ background-color: #F1F3F4 !important; border-top-color: #9E9E9E !important; }

.coupon-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.coupon-store{display:flex;align-items:center;gap:8px}
.store-logo{width:32px;height:32px;border-radius:8px;background:var(--yellow-light);display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--gray-200)}
.store-name{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy)}
.verified-badge{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--green);background:rgba(39,174,96,0.08);padding:3px 8px;border-radius:var(--radius-full);white-space:nowrap}
.verified-badge svg{width:10px;height:10px}
.coupon-discount{font-family:'Luckiest Guy','Arial Black',sans-serif;font-weight:400;font-size:26px;line-height:1.1;text-transform:uppercase;color:var(--red);letter-spacing:0.5px}
.coupon-desc{font-size:13px;color:var(--gray-700);line-height:1.45;min-height:18px}
.coupon-divider{height:1px;background:repeating-linear-gradient(90deg,var(--gray-300),var(--gray-300) 6px,transparent 6px,transparent 12px);margin:2px 0}
.coupon-code-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code-box{font-family:'Courier New',monospace;font-weight:900;font-size:14px;letter-spacing:0.06em;background:var(--navy-soft);color:var(--navy);padding:8px 12px;border-radius:8px;border:1.5px dashed var(--gray-300);flex:1;text-align:center}
.cta-btn{display:flex;align-items:center;gap:6px;background:var(--navy);color:var(--white);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.04em;padding:9px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;box-shadow:0 3px 0 rgba(0,0,0,0.15)}
.cta-btn:hover{background:var(--navy-light);transform:translateY(-1px)}
.cta-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,0.15)}

@media(max-width:640px){
  .how-to-use-banner{ padding: 12px 14px; gap: 10px; }
  .how-to-use-icon{ width: 34px; height: 34px; font-size: 16px; }
  .how-to-use-content h3{ font-size: 14px; }
  .how-to-use-content p{ font-size: 11.5px; }
}
</style>
</head>

<script>
// *** LÓGICA DE RENDERIZADO DE CUPONES Y COLORES ***
// Esta función toma los datos de tu Google Sheet y genera el HTML de cada cupón.
// Mantenemos los enlaces (coupon.link) intactos para asegurar tus ganancias.

function renderCouponCard(coupon) {
  // 1. Procesar el color desde la columna 'color' del Sheet
  const sheetColor = (coupon.color || coupon.Color || '').toLowerCase().trim();
  let colorClass = ''; // Clase CSS predefinida
  let inlineStyle = ''; // Estilo hexadecimal directo

  if (sheetColor) {
    // Definimos los nombres válidos en español e inglés
    const validColors = {
      'amarillo': 'clr-amarillo', 'yellow': 'clr-amarillo',
      'rojo': 'clr-rojo', 'red': 'clr-rojo',
      'azul': 'clr-azul', 'blue': 'clr-azul',
      'verde': 'clr-verde', 'green': 'clr-verde',
      'gris': 'clr-gris', 'gray': 'clr-gris'
    };

    if (validColors[sheetColor]) {
      // Opción A: Es un nombre de color válido, asignamos la clase CSS
      colorClass = validColors[sheetColor];
    } else if (sheetColor.startsWith('#')) {
      // Opción B: Es un código hexadecimal, aplicamos estilo directo
      // Para Hexadecimal, aplicamos el color al borde superior y un fondo muy tenue (opacidad 10%)
      inlineStyle = `style="border-top-color: ${sheetColor} !important; background-color: ${sheetColor}1A !important;"`;
    }
  }

  // 2. Retornar el HTML del cupón con la estructura y enlaces INTACTOS.
  // Tu link de afiliado se mantiene seguro en: href="${coupon.link}"
  return `
    <a href="${coupon.link}" target="_blank" rel="noopener noreferrer" class="coupon ${colorClass}" ${inlineStyle}>
      <div class="coupon-head">
        <div class="coupon-store">
          <div class="store-logo">🛒</div>
          <span class="store-name">${coupon.Tienda || 'Mercado Libre'}</span>
        </div>
        <div class="verified-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> Verificado
        </div>
      </div>
      <div class="coupon-discount">${coupon['Descuento '] || coupon.Descuento || ''}</div>
      <div class="coupon-desc">${coupon['Descripción '] || coupon.Descripción || ''}</div>
      <div class="coupon-divider"></div>
      <div class="coupon-code-row">
        <div class="code-box">${coupon.codigo || 'VER OFERTA'}</div>
        <button class="cta-btn" type="button">
          Copiar y ir
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </a>
  `;
}
</script>
