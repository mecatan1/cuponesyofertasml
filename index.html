<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Tío Cupones · Los mejores cupones de Mercado Libre</title>
<meta name="description" content="El Tío Cupones: códigos de descuento de Mercado Libre actualizados todos los días. Ahorra en tus compras con ofertas verificadas.">

<style>
  :root{
    --sage: #b7d3c4;
    --sage-deep: #86ab98;
    --sage-dark: #5b8571;
    --navy: #1e3a5f;
    --navy-deep: #142944;
    --white: #ffffff;
    --red: #d1483c;
    --ink: #16324a;
    --cream: #fefaf0;
    --wa-green: #1f7a52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--sage);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 3px solid var(--navy); outline-offset: 2px;
  }
  .confetti{ position:absolute; width:34px; height:34px; opacity:.55; pointer-events:none; }
  .confetti svg{ width:100%; height:100%; }

  header{
    position:relative;
    background: linear-gradient(180deg, var(--sage) 0%, var(--sage-deep) 100%);
    padding: 36px 20px 46px;
    text-align:center;
    overflow:hidden;
  }
  .mascot{ display:inline-block; margin-bottom:2px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); }
  .mascot img{ width:180px; height:auto; border-radius:18px; display:block; margin:0 auto; }
  .brand-sub{
    font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color: var(--navy-deep); opacity:.8; margin: 2px 0 12px;
  }
  h1{
    font-family: 'Luckiest Guy', 'Arial Black', sans-serif;
    font-weight:400;
    font-size: clamp(38px, 10.5vw, 66px);
    line-height:1.05;
    margin:0;
    text-transform:uppercase;
    letter-spacing:.01em;
  }
  h1 .line1{
    display:block;
    font-size: 0.66em;
    color: var(--navy);
    -webkit-text-stroke: 2px var(--white);
    text-shadow: 0 2px 0 rgba(0,0,0,.15);
    margin-bottom:2px;
  }
  h1 .accent{
    color: var(--white);
    -webkit-text-stroke: 3px var(--navy);
    text-shadow: 0 3px 0 rgba(0,0,0,.2);
  }
  .sub{ color: var(--navy-deep); font-weight:700; margin-top:16px; font-size:15px; }
  .updated{ display:inline-block; margin-top:14px; padding:6px 16px; background: rgba(255,255,255,.65); border-radius:999px; font-size:12px; font-weight:800; color: var(--navy-deep); }

  .badges{
    max-width: 960px; margin: -22px auto 0; position:relative; z-index:2;
    display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; padding: 0 16px;
  }
  .badge{ background: var(--white); border-radius:14px; padding: 14px 6px 10px; text-align:center; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .badge-icon{ width:38px; height:38px; border-radius:50%; background: var(--red); color:var(--white); display:flex; align-items:center; justify-content:center; margin: 0 auto 6px; font-size:18px; }
  .badge-label{ font-size:10.5px; font-weight:800; color: var(--navy-deep); line-height:1.2; text-transform:uppercase; }
  @media (max-width:520px){ .badges{ grid-template-columns: repeat(2,1fr); } }

  .howto{ max-width:960px; margin: 26px auto 0; padding: 0 16px; }
  .howto-box{
    display:flex; align-items:center; gap:14px;
    background: var(--white); border:2px solid var(--navy);
    border-radius:16px; padding:16px 20px; box-shadow: 0 5px 0 var(--navy);
  }
  .howto-icon{
    flex-shrink:0; width:44px; height:44px; border-radius:50%;
    background: var(--navy); color:var(--white); display:flex; align-items:center;
    justify-content:center; font-size:20px;
  }
  .howto-text{ font-size:13.5px; line-height:1.45; color: var(--ink); }
  .howto-text strong{
    display:block; font-size:15px; color: var(--navy-deep); margin-bottom:2px;
    text-transform:uppercase; letter-spacing:.02em;
  }
  @media (max-width:520px){
    .howto-box{ padding:14px 16px; gap:10px; }
    .howto-icon{ width:38px; height:38px; font-size:17px; }
  }

  main{ max-width:960px; margin:0 auto; padding: 28px 16px 40px; }

  .filters{ margin-bottom:22px; }
  .search-row{ display:flex; gap:8px; margin-bottom:12px; }
  .search-input{
    flex:1; padding:12px 16px; border-radius:999px; border:2px solid var(--sage-dark);
    background: var(--white); color: var(--ink); font-size:14px; font-weight:600; font-family:inherit;
  }
  .search-input::placeholder{ color:#8a9a90; font-weight:600; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:2px solid var(--navy); background: rgba(255,255,255,.35); color: var(--navy-deep);
    font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
    padding:8px 15px; border-radius:999px; cursor:pointer; font-family:inherit;
    transition: all .15s ease;
  }
  .chip:hover{ background: rgba(255,255,255,.65); }
  .chip.active{ background: var(--navy); color: var(--white); }

  #status{ text-align:center; color: var(--navy-deep); font-weight:700; padding:40px 0; font-size:14px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:22px; }

  .skeleton-card{
    background: var(--cream); border-radius:14px; padding:20px; border:2px solid var(--sage-dark);
    display:flex; flex-direction:column; gap:12px; box-shadow: 0 6px 0 var(--sage-dark);
  }
  .sk-line{ background: linear-gradient(90deg, #eee4cc 25%, #f6efdd 37%, #eee4cc 63%); background-size:400% 100%; animation: sk 1.4s ease infinite; border-radius:6px; }
  @keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  .coupon{
    position:relative; background: var(--cream); color: var(--ink);
    border-radius:14px; padding:20px 20px 16px; display:flex; flex-direction:column; gap:10px;
    text-align:left; cursor:pointer; border: 2px solid var(--sage-dark); font-family:inherit;
    text-decoration:none;
    transform:rotate(var(--r,0deg)); transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 0 var(--sage-dark);
  }
  .coupon:hover{ transform: translateY(-4px) rotate(var(--r,0deg)); box-shadow: 0 10px 0 var(--sage-dark); }
  .coupon:active{ transform: translateY(0) rotate(0); }
  .coupon::before, .coupon::after{ content:""; position:absolute; width:20px; height:20px; background: var(--sage); border-radius:50%; top:50%; transform:translateY(-50%); }
  .coupon::before{ left:-10px; }
  .coupon::after{ right:-10px; }
  .store-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .store{ font-size:13.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:900; color: var(--navy); }
  .badges-right{ display:flex; align-items:center; gap:5px; }
  .pop-badge{ font-size:9.5px; font-weight:900; background:#ffebee; color:#c62828; border:1px solid #ef9a9a; padding:2px 7px; border-radius:999px; text-transform:uppercase; }
  .verified{ font-size:9.5px; font-weight:800; color: var(--sage-dark); background: rgba(91,133,113,.14); padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .discount{ font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-weight:400; font-size: 28px; line-height:1.1; text-transform:uppercase; color: var(--red); letter-spacing:.01em; }
  .desc{ font-size:16.5px; font-weight:700; color:#4a4235; min-height:16px; }
  .divider{ border-top:2px dashed var(--sage-deep); margin:2px 0; }
  .code-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .code{ font-family:'Courier New',monospace; font-weight:900; font-size:15px; letter-spacing:.08em; background: var(--navy); color: var(--white); padding:6px 10px; border-radius:6px; }
  .cta{ font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color: var(--red); }

  .meta-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; padding-top:6px; border-top:1px solid rgba(0,0,0,.06); flex-wrap:wrap; }
  .vote-group{ display:flex; align-items:center; gap:6px; z-index:3; }
  .vote-btn{
    display:inline-flex; align-items:center; gap:4px;
    background: rgba(255,255,255,.88); border:1.5px solid var(--sage-dark);
    color: var(--navy-deep); font-weight:800; font-size:11.5px;
    padding:4px 9px; border-radius:999px; cursor:pointer; font-family:inherit;
    transition: transform .12s ease, background .12s ease;
  }
  .vote-btn:hover{ background:#fff; transform:scale(1.06); }
  .vote-btn.voted-up{ background:#e8f5e9; border-color:#2e7d32; color:#1b5e20; }
  .vote-btn.voted-down{ background:#ffebee; border-color:#c62828; color:#b71c1c; }

  .uses{ font-size:12px; font-weight:900; color: var(--sage-dark); display:flex; align-items:center; gap:4px; }
  .no-results{ text-align:center; padding:40px 16px; color: var(--navy-deep); font-weight:700; }
  .no-results button{ margin-top:10px; background:var(--navy); color:var(--white); border:none; padding:8px 18px; border-radius:999px; font-weight:800; cursor:pointer; font-family:inherit; }

  .countdown{ font-size:11.5px; font-weight:900; color: var(--sage-dark); display:flex; align-items:center; gap:4px; }
  .countdown.expired{ font-size:12px; color: var(--red); font-weight:900; text-transform:uppercase; letter-spacing:.03em; }

  /* ===== SECCIÓN OFERTAS ===== */
  .ofertas{ max-width:960px; margin:0 auto; padding:10px 16px 30px; }
  .ofertas-head{ text-align:center; margin-bottom:20px; }
  .ofertas-title{
    font-family:'Luckiest Guy','Arial Black',sans-serif; font-weight:400;
    font-size:clamp(26px,7vw,38px); color:var(--navy); text-transform:uppercase; margin:0;
    -webkit-text-stroke:1.5px var(--white); text-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .ofertas-sub{ font-size:13px; font-weight:700; color:var(--navy-deep); margin-top:6px; }
  .ofertas-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
  @media (max-width:520px){ .ofertas-grid{ grid-template-columns:repeat(2,1fr); gap:10px; } }
  .oferta-wrap{ perspective:900px; transition:transform .15s ease; }
  .oferta-wrap:hover{ transform:translateY(-4px); }
  .oferta-flip{ position:relative; height:100%; transform-style:preserve-3d; transition:transform .45s ease; }
  .oferta-wrap.flipped .oferta-flip{ transform:rotateY(180deg); }
  .oferta-face{
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    background:var(--cream); border:2px solid var(--sage-dark); border-radius:14px; overflow:hidden;
    box-shadow:0 6px 0 var(--sage-dark); transition:visibility 0s linear .22s;
  }
  .oferta-front{ position:relative; height:100%; display:flex; flex-direction:column; }
  .oferta-back{ position:absolute; top:0; right:0; bottom:0; left:0; transform:rotateY(180deg); visibility:hidden; display:flex; flex-direction:column; padding:12px; gap:8px; }
  .oferta-wrap.flipped .oferta-back{ visibility:visible; }
  .oferta-wrap.flipped .oferta-front{ visibility:hidden; }
  .oferta{ display:flex; flex-direction:column; flex:1; text-decoration:none; color:var(--ink); }
  .oferta-info-btn{ border:0; border-top:2px dashed var(--sage-deep); background:var(--cream); color:var(--navy); font:inherit; font-weight:800; font-size:11.5px; padding:8px; cursor:pointer; }
  .oferta-info-btn:hover{ background:#f6efdd; }
  .oferta-back-top{ display:flex; align-items:center; gap:8px; }
  .oferta-back-btn{ width:32px; height:32px; border-radius:50%; border:2px solid var(--navy); background:var(--white); color:var(--navy); font-size:16px; font-weight:900; cursor:pointer; line-height:1; flex-shrink:0; }
  .oferta-back-title{ font-size:12px; font-weight:900; color:var(--navy-deep); text-transform:uppercase; letter-spacing:.05em; }
  .oferta-back-text{ font-size:12.5px; line-height:1.45; color:var(--ink); white-space:pre-line; overflow-y:auto; flex:1; }
  .oferta-uses{ font-size:11.5px; font-weight:900; color:var(--sage-dark); margin-bottom:6px; }
  .oferta-img{ position:relative; background:#fff; aspect-ratio:1/1; overflow:hidden; }
  .oferta-img img{ position:absolute; top:8px; left:8px; width:calc(100% - 16px); height:calc(100% - 16px); object-fit:contain; display:block; }
  .oferta-badge{
    position:absolute; top:10px; left:10px; background:var(--red); color:var(--white);
    font-weight:900; font-size:12px; padding:5px 10px; border-radius:999px; letter-spacing:.03em; z-index:1;
  }
  .oferta-body{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1; background:var(--cream); }
  .oferta-name{ font-size:13px; font-weight:800; color:var(--navy-deep); line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .oferta-seller{ font-size:11px; font-weight:700; color:var(--sage-dark); }
  .oferta-desc{ font-size:12px; color:#5a5142; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .oferta-old{ font-size:13px; font-weight:700; color:#8a8577; text-decoration:line-through; margin-top:4px; }
  .oferta-price{ font-family:'Luckiest Guy','Arial Black',sans-serif; font-size:24px; color:var(--red); line-height:1.1; }
  .oferta-cta{
    margin-top:auto; text-align:center; background:var(--navy); color:var(--white);
    font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
    padding:9px 8px; border-radius:10px;
  }

  .disclosure{
    max-width:960px; margin:0 auto; padding: 0 16px; text-align:center;
    font-size:11px; color: var(--navy-deep); opacity:.75; line-height:1.5;
  }

  .wa-float{
    position:fixed; right:18px; bottom:18px; width:60px; height:60px; border-radius:50%;
    background: var(--wa-green); display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 16px rgba(0,0,0,.28); z-index:50; text-decoration:none;
    animation: wa-pulse 2.6s ease-in-out infinite;
  }
  .wa-float:hover{ background:#1a6a48; }
  .wa-float svg{ width:30px; height:30px; fill:#fff; }
  .wa-float-label{
    position:absolute; right:70px; bottom:16px; background: var(--navy); color:#fff;
    font-size:12px; font-weight:800; padding:8px 12px; border-radius:8px; white-space:nowrap;
    box-shadow:0 4px 0 rgba(0,0,0,.15); opacity:0; transform:translateX(6px); pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .wa-float:hover .wa-float-label{ opacity:1; transform:translateX(0); }
